[package]
name = "logs-gateway"
version = "0.2.0"
edition = "2024"
description = "Async log gateway between a FiveM server and an external panel"
license = "GPL-3.0"

[dependencies]
chrono = "0.4"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
